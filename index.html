<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FURY - a terminal tank battle game you can play in your browser.">
    <title>FURY Tank Warfare</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" integrity="sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP" crossorigin="anonymous">
    <link rel="stylesheet" href="web/style.css">
</head>
<body>
    <header>
        <h1>FURY <span>Tank Warfare</span></h1>
        <button id="restart" type="button">Restart game</button>
    </header>
    <main>
        <div id="terminal" aria-label="Game terminal"></div>
    </main>
    <footer>
        Type your answers and press Enter.
        <a href="https://github.com/kpetrauskas92/fury-p3">Source on GitHub</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" integrity="sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js" integrity="sha384-iF+jqbuti4XlB64clWgFWYEscb+UnSRv3VgVikGYZu+otNFnSHr7y7NcKfBnGizn" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js" integrity="sha384-Dz8WbRJS+zEg3mTsQKFzS7uiJxTV6CVDI6lD5b49KMnhy6hlO1vl+ru6YCYNiaXz" crossorigin="anonymous"></script>
    <script src="web/config.js"></script>
    <script src="web/app.js"></script>
</body>
</html>
